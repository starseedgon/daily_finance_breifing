name: Publish finance briefing

on:
  workflow_dispatch:
    inputs:
      provider:
        description: Data provider
        required: true
        default: fdr
        type: choice
        options: [fdr, fixture]
  schedule:
    # Weekdays at 07:20 KST. Observe start time/as_of/missing_ratio for 1–2 weeks.
    - cron: "20 22 * * 1-5"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: python -m pip install -e '.[live]'
      - name: Generate HTML
        env:
          PROVIDER: ${{ github.event.inputs.provider || 'fdr' }}
        run: python -m finance_briefing --provider "$PROVIDER" --output-dir public
      - uses: actions/upload-artifact@v4
        with:
          name: finance-briefing-${{ github.run_id }}
          path: public/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
