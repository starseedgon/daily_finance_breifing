[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "daily-finance-briefing"
version = "0.1.0"
description = "A deterministic daily finance briefing generator"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
live = ["finance-datareader>=0.9.94"]
test = ["pytest>=8"]

[project.scripts]
finance-briefing = "finance_briefing.cli:main"

[tool.setuptools.package-data]
finance_briefing = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: tests that access external finance data"]
